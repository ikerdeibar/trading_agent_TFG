[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # LLM + API
    "openai>=1.30.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    # Data schemas
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Market data + broker
    "alpaca-py>=0.20.0",
    # Technical indicators
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    # RAG
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    # Storage
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    # Utils
    "httpx>=0.27.0",
    "diskcache>=5.6.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
