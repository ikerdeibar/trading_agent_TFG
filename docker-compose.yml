services:
  postgres:
    image: postgres:16
    container_name: trading_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     trader
      POSTGRES_PASSWORD: trader_password@1297
      POSTGRES_DB:       tradingagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
